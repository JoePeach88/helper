name: Create helper Release

on:
  push:
    tags:
      - '*.*'
      - '*.*-dev*'

jobs:
  build:
    name: Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: "[Step 1] Checkout code"
        uses: actions/checkout@v2
  
      - name: "[Step 2] Set up Python"
        uses: actions/setup-python@v3
        with:
          python-version: '3.11'

      - name: "[Step 3] Install Dependencies"
        run: |
          python -m pip install --upgrade pip
          if [ -f ./requirements.txt ]; then pip install -r ./requirements.txt; fi
          if [ -f ./helpers/core/requirements.txt ]; then pip install -r ./helpers/core/requirements.txt; fi
          if [ -f ./helpers/modules/requirements.txt ]; then pip install -r ./helpers/modules/requirements.txt; fi
        continue-on-error: true

      - name: "[Step 4] Execute Python Script"
        id: build
        run: |
          echo "release_name=$(python3 ./build.py | tail -n 1)" >> "$GITHUB_OUTPUT"

      - name: "[Step 5] Check Release Type"
        id: check_type
        run: |
          if [[ "$GITHUB_REF_NAME" == *"-dev"* ]]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
            echo "release_suffix=(dev)" >> "$GITHUB_OUTPUT"
            echo "body_suffix=" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
            echo "release_suffix=(stable)" >> "$GITHUB_OUTPUT"
            echo "body_suffix=-stable" >> "$GITHUB_OUTPUT"
          fi

      - name: "[Step 6] Create Release"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_NAME: helper v.${{ steps.build.outputs.release_name }} ${{ steps.check_type.outputs.release_suffix }}
          IS_PRERELEASE: ${{ steps.check_type.outputs.is_prerelease }}
        run: |
          args=(
            "$GITHUB_REF_NAME"
            --title "$RELEASE_NAME"
            --generate-notes
          )
          if [[ "$IS_PRERELEASE" == "true" ]]; then
            args+=(--prerelease)
          fi
          gh release create "${args[@]}"

      - name: "[Step 7] Add Changelog to Release"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BODY_SUFFIX: ${{ steps.check_type.outputs.body_suffix }}
        run: |
          changelog="./changelogs/${GITHUB_REF_NAME}${BODY_SUFFIX}.md"
          if [ ! -f "$changelog" ]; then
            echo "Changelog not found: $changelog"
            exit 1
          fi
          gh release edit "$GITHUB_REF_NAME" --notes-file "$changelog"

      - name: "[Step 8] Upload Installers"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          files=(setup*)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No installer files matching setup* were found."
            exit 1
          fi
          gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber

      - name: "[Step 9] Delete older releases"
        uses: dev-drprasad/delete-older-releases@v0.3.4
        with:
          keep_latest: 3
          delete_tags: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
